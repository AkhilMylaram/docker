apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""  # Ensure this is left empty for manual PV provisioning
  awsElasticBlockStore:
    volumeID: vol-0543773fa75cd5d49  # Correct EBS volume ID
    fsType: ext4

